services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-v4-flash}"
      AGENT_DETECTOR_API_KEY: "${AGENT_DETECTOR_API_KEY:-}"
      AGENT_DETECTOR_CORS_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE: ""
    environment:
      AGENT_DETECTOR_API_KEY: "${AGENT_DETECTOR_API_KEY:-}"
      NGINX_ENVSUBST_FILTER: "AGENT_DETECTOR_API_KEY"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
